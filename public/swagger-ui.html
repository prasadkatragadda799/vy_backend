<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoga API – Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.onload = function () {
      // Use embedded spec if provided by server (avoids 404 on Railway/proxies); else fetch from URL
      const config = {
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: 'BaseLayout'
      };
      if (window.OPENAPI_SPEC) {
        config.spec = window.OPENAPI_SPEC;
      } else {
        config.url = new URL('openapi.json', window.location.href).href;
      }
      window.ui = SwaggerUIBundle(config);
    };
  </script>
</body>
</html>
